name: Plugin source validation

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the dual plugin manifests
        run: |
          test -f plugin.json
          test -f .codex-plugin/plugin.json
      - name: Validate the schema v2 portable contract
        run: node scripts/verify-portable-contract.mjs
      - name: Verify refresh retry lifecycle
        run: node --test scripts/verify-refresh-retry.mjs

  source-preflight:
    needs: manifest
    uses: xsec-labs/xsec-plugins/.github/workflows/first-party-source-preflight.yml@693b80c265ad23d5c537f5611caab79b85dc575b # main
    with:
      plugin_id: com.xsec.attack-path

  manifest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run the manifest tests
        run: node --test tests/manifest.test.mjs
